<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: white;" >
    <h1>How to create div throw js</h1>
</body>
<script>

    // how to  cretae div.
    const div = document.createElement('div');
    console.log(div);
    div.className = "main";
    div.id = "myid"
    div.setAttribute("title", "generated title") // setAttribute("key", "Value") set any attribute.
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Hello" ;

    const addText =  document.createTextNode("Hello i create text");
    div.appendChild(addText)
    document.body.appendChild(div);


</script>
</html>
