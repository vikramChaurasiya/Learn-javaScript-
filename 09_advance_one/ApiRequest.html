<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body ">  <!--   style="background-color: #212121; -->
    <p>0	UNSENT	Client has been created. open() not called yet.</p>
    <p>1 OPENED	open() has been called. </p>
    <p>2	HEADERS_RECEIVED	send() has been called, and headers and status are available.</p>
    <p> 3	LOADING	Downloading; responseText holds partial data. </p>
    <p>4	DONE	The operation is complete. </p>
</body>
<script>
    const requestUrl = 'https://api.github.com/users/vikramChaurasiya'
    const xhr = new XMLHttpRequest();  //Use XMLHttpRequest (XHR) objects to interact with servers. You can retrieve data from a URL without having to do a full page refresh. 
    xhr.open('GET', requestUrl)
    
    xhr.onreadystatechange = function(){  //onreadystatechange change state every time.
        console.log(xhr.readyState);
        if (xhr.readyState === 4) { 
            const data = JSON.parse(this.responseText) //convert JSON data to  object.
            console.log(typeof data); //search data type
            console.log(data.followers); //find api data
        }
    }
    xhr.send(); //send api request.
</script>
</html>
